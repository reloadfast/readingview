# Golden CI 4.0.0 — global-standards 64ec40904a302c81c23aeb51c9de1fb2292969ba.
# Runner prerequisites and adoption gates: docs/ci.md.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    # Existing label on unraid-runner; provision its pinned tool image before adoption.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: forgejo.moseisley.es/wind/readingview
      REGISTRY: forgejo.moseisley.es
      REGISTRY_USERNAME: Wind
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify locked dependencies and project checks
        run: bash scripts/ci/verify.sh
      - name: Secret and dependency checks
        run: bash scripts/ci/security.sh
      - name: Build, smoke-test and scan local image
        run: bash scripts/ci/container.sh
      - name: Publish tested image and retain three releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: bash scripts/ci/publish.sh
      - name: Remove this run's local candidate
        if: always()
        run: |
          if [ -n "${CI_LOCAL_IMAGE:-}" ]; then
            docker image rm "$CI_LOCAL_IMAGE" >/dev/null 2>&1 || true
          fi
